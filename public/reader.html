<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="content-type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" href="./favicon.png" sizes="32x32">
  <link rel="icon" href="./favicon.png" sizes="192x192">
  <link rel="apple-touch-icon" href="./favicon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>WordLight — Reader</title>
  <link rel="stylesheet" href="./styles.css">
  <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* Defaults — overridden from preferences stored in localStorage */
        :root {
          --bg-r:           #000000;
          --text-current: #ffffff;
          --text-prev:    rgba(255,255,255,0.45);
          --font-size:    2rem;
          --font-family:  system-ui, -apple-system, Arial, sans-serif;
        }
        
        html, body {
          height: 100%;
          background: var(--bg-r);
        }
        
        body {
          display: flex;
          flex-direction: column;
          /* IMPORTANT: height, not min-height. min-height lets the page grow
             taller than one screen whenever a long caption (especially at a
             large font-size preference) needs more room than fits — which
             makes the page scrollable, so the current caption can silently
             end up below the fold. Since this is a live, hands-off display
             the audience never interacts with, the page must NEVER scroll —
             a fixed height plus overflow:hidden below forces .caption-area's
             flex-end layout to sacrifice older context lines (prev2, then
             prev) first, keeping the current line's bottom always visible. */
          height: 100%;
          height: 100dvh;
          overflow: hidden;
          padding: env(safe-area-inset-top) env(safe-area-inset-right)
                   env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        
        .status-logo {
        align-items: center;
        position: fixed;
        right: 50%;
        top: max(0.75rem, env(safe-area-inset-top))
        };
        
        /* ──  Preload animation ── */
        @keyframes fadeOut{
          0% {opacity:1;}
          25% {opacity:1;}
          100% {opacity:0; display: none;}
        }

        @-moz-keyframes fadeOut {
          0% {opacity:1;}
          25% {opacity:1;}
          100% {opacity:0; display: none;}
        }
        
        @-webkit-keyframes fadeOut {
          0% {opacity:1;}
          25% {opacity:1;}
          100% {opacity:0; display: none;}
        }
        
        @-o-keyframes fadeOut {
          0% {opacity:1;}
          25% {opacity:1;}
          100% {opacity:0; display: none;}
        }
        
        @-ms-keyframes fadeOut {
          0% {opacity:1;}
          25% {opacity:1;}
          100% {opacity:0; display: none;}
        }

        .fade-out-preload {
          /* IMPORTANT: position:fixed + inset:0 takes this OUT of body's
             normal flex flow entirely, so it's a true full-screen overlay
             rather than a sibling competing for space with .caption-area.
             Without this, once live captions arrive and .caption-area
             switches on (which can happen well before this 5s animation
             finishes), flexbox's default flex-shrink:1 squeezes BOTH the
             still-visible preloader AND the caption text into shared,
             reduced space — showing a confusing overlap of the welcome
             message and live captions at once, rather than the preloader
             fully covering the screen until it's actually done fading. */
          position: fixed;
          inset: 0;
          z-index: 250;
          background: var(--bg-r, #000);

          display: flex;
          flex-direction: column; /* Stacks items vertically */
          justify-content: center; /* Horizontal centering */
          align-items: center;     /* Vertical centering */
        
          animation: fadeOut ease 5s forwards; 
          -webkit-animation: fadeOut ease 5s forwards;
          -moz-animation: fadeOut ease 5s forwards;
          -o-animation: fadeOut  ease 5s forwards;
          -ms-animation: fadeOut ease 5s forwards;
          
        }
        
        .welcome {
          color: rgba(255,255,255,0.3);
          font-size: 2rem;
          font-family: system-ui, sans-serif;
          text-align: center;
          line-height: 1.6;
          
        }

        /* ── Caption display ── */
        .caption-area {
          flex: 1;
          display: flex;
          flex-direction: column;
          justify-content: flex-end;
          padding: 1rem 1.2rem 2rem;
          gap: 0.6rem;
          /* Flex items default to min-height:auto, which can let content
             force this box taller than its flex:1 allocation despite the
             parent's fixed height — overriding that, plus overflow:hidden,
             is what actually makes flex-end sacrifice older lines first
             instead of the whole block silently overflowing the page. */
          min-height: 0;
          overflow: hidden;
        }

  </style>
</head>
<body>
  <!-- Top Bar -->
<div class="conn-badge" id="connBadge">
    <span class="conn-dot" id="connDot"></span> <span id="connLabel">Connecting…</span>
  </div>
  <span class="status-logo" id="headerlogo">
     <img class="iconlargeimg" alt="Theater Logo" src="./iconlarge.png" style="height: 1rem";>
  </span>
  <a class="settings-btn" href="/preferences" title="Reader Preferences">⚙️</a>
  <div class="wakelock-badge" id="wakelockBadge" title="Screen wake lock status">
    <span id="wakelockIcon">☀️</span> <span id="wakelockLabel">Screen on</span>
  </div>
  
  <!-- Preloader -->
  <!-- Skip-check runs synchronously before the div is painted so the
       animation never starts when the user has visited within 12 hours. -->
  <script>
    (function () {
      var SESSION_MS = 12 * 60 * 60 * 1000; // 12 hours — matches server session
      var last = parseInt(localStorage.getItem('preloadShown') || '0', 10);
      if (Date.now() - last < SESSION_MS) {
        // Already shown recently — inject a style that hides the preloader
        // immediately, before the element exists in the DOM.
        document.write('<style>#preloader{display:none!important}</style>');
      } else {
        // First visit (or session expired) — record the time so return visits skip it.
        localStorage.setItem('preloadShown', Date.now().toString());
      }
    })();
  </script>
  <div id="preloader" class="fade-out-preload">
    <div id="preloadimg">
        <img id="iconlargeimg" alt="Welcome to the Close Caption Viewer" src="./iconlarge.png">
    </div>
    <div id="preloadtext" class="welcome">
        Welcome to the 
        <div id="theatername"></div>
        Caption Viewer
    </div>
  </div>
  <script>
    // Safety net: the fadeOut keyframe above sets display:none at 100%, but
    // animating a discrete property like display isn't reliably honored by
    // every browser (Safari in particular has been inconsistent here). If
    // it's ever NOT honored, the preloader — though invisible at opacity:0 —
    // would still occupy real flex layout space in body, silently shrinking
    // .caption-area's available height. This listener guarantees it's
    // actually removed from layout once the animation finishes, regardless
    // of whether the browser applied the keyframe's display:none itself.
    document.getElementById('preloader').addEventListener('animationend', function () {
      this.style.display = 'none';
    });
  </script>

  

<!-- Intermission overlay -->
  <div class="intermission-overlay" id="intermissionOverlay">
    <div class="intermission-icon">
      ☕
    </div>
    <div class="intermission-title">
      Please Stand By
    </div>
    <div class="intermission-dots"><span></span><span></span><span></span></div>
  </div>

<!-- Waiting state shown before any content -->
  <div class="waiting" id="waitingMsg">
    Waiting for the presenter to start…
  </div>

<!-- Caption display -->
  <div class="caption-area" id="captionArea" style="display:none">
    <div class="prev-line-2" id="prevLine2"></div>
    <div class="prev-line" id="prevLine"></div>
    <div class="divider" id="divider" style="display:none"></div>
    <div class="current-line" id="currentLine"></div>
  </div>

<!-- Live type overlay — shown when controller is free-typing -->
  <div class="live-overlay" id="liveOverlay">
    <div class="live-badge">
      Live
    </div>
    <div class="live-text" id="liveText"></div>
  </div>
  
  <script src="./global.js"></script>
  <script src="/socket.io/socket.io.js"></script> 
  <script>

        
        // ── Reader ID ────────────────────────────────────────────────────────────────
        // Stored in localStorage — identifies this device for usage tracking.
        // Contains no personal data.
        const readerId = getOrCreateReaderId('WEBR');
        
        // ── Apply Saved Preferences ──────────────────────────────────────────────────────────────
        function applyPreferences() {
          const prefs = JSON.parse(localStorage.getItem('captionPrefs') || '{}');
          const root  = document.documentElement;
          
          if (prefs.bgColor)    { root.style.setProperty('--bg-r',           prefs.bgColor); document.body.style.backgroundColor = prefs.bgColor; }
          if (prefs.textColor)  root.style.setProperty('--text-current', prefs.textColor);
          if (prefs.prevColor)  root.style.setProperty('--text-prev',    prefs.prevColor);
          if (prefs.fontSize)   root.style.setProperty('--font-size',    prefs.fontSize + 'rem');
          if (prefs.fontFamily) root.style.setProperty('--font-family',  prefs.fontFamily);
          
          // Apply background color to body too for full coverage
          if (prefs.bgColor) document.body.style.backgroundColor = prefs.bgColor;
        }
        applyPreferences();
        
        // ── Wake Lock ────────────────────────────────────────────────────────────────
        let wakeLock     = null;
        const wlBadge    = document.getElementById('wakelockBadge');
        const wlIcon     = document.getElementById('wakelockIcon');
        const wlLabel    = document.getElementById('wakelockLabel');
        
        async function requestWakeLock() {
          if (!('wakeLock' in navigator)) {
            // Browser doesn't support Wake Lock — show a muted badge
            wlIcon.textContent  = '🌙';
            wlLabel.textContent = 'Wake lock unavailable';
            wlBadge.classList.add('visible', 'unsupported');
            return;
          }
          try {
            wakeLock = await navigator.wakeLock.request('screen');
            wlIcon.textContent  = '☀️';
            wlLabel.textContent = 'Screen on';
            wlBadge.classList.add('visible');
            wlBadge.classList.remove('unsupported');
        
            wakeLock.addEventListener('release', () => {
              wlIcon.textContent  = '🌙';
              wlLabel.textContent = 'Screen lock active';
              wakeLock = null;
            });
          } catch (err) {
            // Permission denied or unavailable (e.g. not on HTTPS) — fail silently
            console.warn('Wake lock request failed:', err.message);
          }
        }
        
        // Re-acquire wake lock when tab becomes visible again (OS releases it on hide)
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') requestWakeLock();
        });
        
        requestWakeLock();
        
        // ── Socket Connection ───────────────────────────────────────────────────────
        const socket = io({ query: { type: 'reader', readerId } });
        
        socket.on('connect', () => {
          setConnected(true);
        });
        
        socket.on('disconnect', () => {
          setConnected(false);
        });
        
        socket.on('state-update', (data) => {
          renderCaptions(data);
        });
        
        function setConnected(connected) {
          const dot   = document.getElementById('connDot');
          const label = document.getElementById('connLabel');
          const badge = document.getElementById('connBadge');
          dot.className  = 'conn-dot' + (connected ? ' connected' : '');
          badge.className = 'conn-badge' + (connected ? ' connected' : '');
          label.textContent = connected ? 'Live' : 'Reconnecting…';
        }
        
        // ── Caption Rendering ────────────────────────────────────────────────────────
        let lastIndex = -2;
        
        function renderCaptions(state) {
          const { current, prev, prev2, currentIndex, liveText, intermission } = state;
        
          const waiting        = document.getElementById('waitingMsg');
          const captionArea    = document.getElementById('captionArea');
          const liveOverlay    = document.getElementById('liveOverlay');
          const liveTextEl     = document.getElementById('liveText');
          const currentEl      = document.getElementById('currentLine');
          const prevEl         = document.getElementById('prevLine');
          const prev2El        = document.getElementById('prevLine2');
          const divider        = document.getElementById('divider');
          const intermissionEl = document.getElementById('intermissionOverlay');
        
          // ── Intermission takes top priority ──────────────────────────────────────
          if (intermission) {
                  intermissionEl.classList.add('visible');
                  waiting.style.display        = 'none';
                  captionArea.style.display    = 'none';
                  liveOverlay.style.display    = 'none';
                  return;
                }
                intermissionEl.classList.remove('visible');
                
          // ── Live text takes priority ──────────────────────────────────────────────
          const hasLive = liveText && liveText.trim().length > 0;
        
          if (hasLive) {
            waiting.style.display      = 'none';
            liveOverlay.style.display  = 'flex';
            // Dim the script behind it
            captionArea.style.display  = current ? 'flex' : 'none';
            captionArea.classList.add('dimmed');
            liveTextEl.innerHTML   = parseColorTags(liveText);
          } else {
            liveOverlay.style.display = 'none';
            captionArea.classList.remove('dimmed');
          }
        
          // ── Script lines ─────────────────────────────────────────────────────────
          if (!current && currentIndex < 0) {
      if (!hasLive) { waiting.style.display = 'flex'; captionArea.style.display = 'none'; }
      return;
    }
    if (!hasLive) { waiting.style.display = 'none'; captionArea.style.display = 'flex'; }

    if (currentIndex !== lastIndex) {
      currentEl.classList.remove('animate');
      void currentEl.offsetWidth;
      currentEl.classList.add('animate');
      lastIndex = currentIndex;
    }

    currentEl.innerHTML   = parseColorTags(stripNote(current));
    prevEl.innerHTML      = parseColorTags(stripNote(prev   || ''));
    prev2El.innerHTML     = parseColorTags(stripNote(prev2  || ''));

    // Record what the "ideal" full state wants to show, based purely on
    // whether there's content — fitCaptionToScreen() below uses these as
    // its starting point each time, then trims further (oldest first) only
    // if the full stack doesn't actually fit on screen.
    prev2El.dataset.wants = prev2 ? '1' : '0';
    prevEl.dataset.wants  = prev  ? '1' : '0';

    divider.style.display = prev  ? 'block' : 'none';
    prevEl.style.display  = prev  ? 'block' : 'none';
    prev2El.style.display = prev2 ? 'block' : 'none';

    fitCaptionToScreen();
  }

  // ── Autofit: guarantee the CURRENT line is always fully visible ──────────
  //
  // flexbox's justify-content:flex-end already prefers to sacrifice the
  // TOP of an overflowing stack (older lines) over the bottom — but that
  // only holds true when the *combined* stack overflows. It breaks down in
  // one specific case: if the current line ALONE (e.g. a very long caption
  // combined with a large font-size preference) is taller than the whole
  // screen, flex-end would push its TOP above the visible area while its
  // bottom stays visible — clipping the START of the current caption
  // instead of old context. That's the opposite of what we want.
  //
  // This function actively measures and prevents that: it drops prev2,
  // then prev, if the stack doesn't fit — and if the current line alone
  // still doesn't fit even then, shrinks just that line's font size in
  // small steps (down to a 60% floor) until it does. The current caption
  // is never partially cut off; at worst it's temporarily a bit smaller.
  //
  // Always starts fresh from the dataset "wants" markers set above, so a
  // short caption immediately after a long one restores full context and
  // full size — nothing carries over or compounds between renders.
  function fitCaptionToScreen() {
    const area      = document.getElementById('captionArea');
    const prev2El   = document.getElementById('prevLine2');
    const prevEl    = document.getElementById('prevLine');
    const divider   = document.getElementById('divider');
    const currentEl = document.getElementById('currentLine');

    if (area.style.display === 'none') return;   // nothing on screen to fit

    const wantsPrev2 = prev2El.dataset.wants === '1';
    const wantsPrev  = prevEl.dataset.wants  === '1';

    // Reset to the full/ideal state before measuring — this is what makes
    // it safe to call on every render without state leaking between calls.
    prev2El.style.display   = wantsPrev2 ? 'block' : 'none';
    prevEl.style.display    = wantsPrev  ? 'block' : 'none';
    divider.style.display   = wantsPrev  ? 'block' : 'none';
    currentEl.style.fontSize = '';

    // Step 1 — sacrifice oldest context first, one line at a time.
    if (wantsPrev2 && area.scrollHeight > area.clientHeight) {
      prev2El.style.display = 'none';
    }
    if (wantsPrev && area.scrollHeight > area.clientHeight) {
      prevEl.style.display  = 'none';
      divider.style.display = 'none';
    }

    // Step 2 — extreme edge case: even the current line alone doesn't fit.
    // Shrink its font size in 5% steps down to a 60% floor. Chosen over
    // ever clipping any part of the text — a smaller-but-complete caption
    // is still usable; a partially-missing one isn't.
    const baseRem = parseFloat(
      getComputedStyle(document.documentElement).getPropertyValue('--font-size')
    ) || 2;
    let scale = 1.0;
    while (area.scrollHeight > area.clientHeight && scale > 0.6) {
      scale -= 0.05;
      currentEl.style.fontSize = (baseRem * scale) + 'rem';
    }
  }

  // Viewport size can change after a caption is already on screen (browser
  // window resized, phone rotated) — re-run the fit check when that
  // happens, debounced so a drag-resize doesn't trigger it dozens of times.
  let resizeFitTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeFitTimer);
    resizeFitTimer = setTimeout(fitCaptionToScreen, 150);
  });
  </script>
</body>
</html>
